<!doctype html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex, nofollow" />
    <title>کانفیگ شما — V2Box</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <style>
      :root {
        --bg: #070b14; --surface: #101828; --surface-2: #151f31; --line: #22304a;
        --ink: #e8eefc; --muted: #8fa0bd; --accent: #10b981; --danger: #f43f5e; --warn: #f59e0b;
        --mono: "SFMono-Regular", Menlo, Consolas, monospace;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0; min-height: 100vh; padding: 26px 16px 44px;
        background: radial-gradient(900px 500px at 80% -10%, rgba(16, 185, 129, .14), transparent 60%), var(--bg);
        color: var(--ink); font-family: "Vazirmatn", system-ui, sans-serif; font-size: 14.5px; line-height: 1.8;
      }
      .wrap { max-width: 620px; margin: 0 auto; display: grid; gap: 16px; }
      .card { background: linear-gradient(180deg, var(--surface-2), var(--surface)); border: 1px solid var(--line); border-radius: 18px; padding: 18px; }
      .head { display: flex; align-items: center; gap: 12px; }
      .mark { width: 46px; height: 46px; border-radius: 14px; display: grid; place-items: center; font-weight: 800; color: #04121a; background: linear-gradient(140deg, var(--accent), #0ea5e9); flex: none; }
      h1 { font-size: 17px; margin: 0; }
      .sub { color: var(--muted); font-size: 12.4px; margin: 2px 0 0; }
      .status { display: inline-flex; align-items: center; gap: 7px; padding: 4px 12px; border-radius: 99px; font-size: 12.4px; font-weight: 600; border: 1px solid var(--line); background: var(--surface-2); }
      .status.active { color: var(--accent); border-color: rgba(16, 185, 129, .35); background: rgba(16, 185, 129, .12); }
      .status.expired, .status.disabled { color: var(--danger); border-color: rgba(244, 63, 94, .35); background: rgba(244, 63, 94, .12); }
      .status.limited { color: var(--warn); border-color: rgba(245, 158, 11, .35); background: rgba(245, 158, 11, .12); }
      .grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
      .box { background: rgba(255, 255, 255, .03); border: 1px solid var(--line); border-radius: 13px; padding: 12px; }
      .box span { display: block; color: var(--muted); font-size: 11.6px; }
      .box strong { font-size: 16px; }
      .bar { height: 8px; background: #1b2740; border-radius: 99px; overflow: hidden; margin-top: 10px; }
      .bar > i { display: block; height: 100%; background: linear-gradient(90deg, var(--accent), #0ea5e9); }
      .bar.over > i { background: linear-gradient(90deg, var(--danger), #fb7185); }
      code { font-family: var(--mono); direction: ltr; unicode-bidi: isolate; }
      .link { background: #05080f; border: 1px solid var(--line); border-radius: 12px; padding: 11px; font-size: 11.6px; color: #9fd8c1; word-break: break-all; white-space: pre-wrap; line-height: 1.8; max-height: 110px; overflow: auto; }
      .btn { display: inline-flex; align-items: center; justify-content: center; gap: 7px; border-radius: 11px; border: 1px solid var(--line); background: var(--surface-2); color: var(--ink); font: inherit; font-size: 13px; padding: 9px 15px; cursor: pointer; text-decoration: none; }
      .btn.primary { background: linear-gradient(140deg, var(--accent), #059669); color: #04140e; border-color: transparent; font-weight: 700; }
      .row { display: flex; gap: 9px; flex-wrap: wrap; }
      .qr { background: #fff; border-radius: 14px; padding: 12px; display: grid; place-items: center; margin: 0 auto; width: fit-content; }
      .qr img { width: 220px; height: 220px; display: block; image-rendering: pixelated; }
      .hint { color: var(--muted); font-size: 12.2px; margin: 0; }
      .err { color: var(--danger); }
      @media (max-width: 520px) { .grid { grid-template-columns: 1fr; } }
    </style>
  </head>
  <body>
    <div class="wrap">
      <div class="card head">
        <span class="mark">V2</span>
        <div>
          <h1 id="title">در حال بارگذاری کانفیگ…</h1>
          <p class="sub" id="subtitle">صفحهٔ اشتراک کاربر</p>
        </div>
        <div style="margin-inline-start:auto" id="statusBox"></div>
      </div>

      <div id="content" class="card"><p class="hint">لطفاً چند لحظه صبر کنید…</p></div>

      <p class="hint" style="text-align:center">
        این صفحه فقط با نشانی اشتراک شما قابل مشاهده است؛ آن را در اختیار دیگران قرار ندهید.
      </p>
    </div>

    <script>
      'use strict';
      const FA = '۰۱۲۳۴۵۶۷۸۹';
      const toFa = (v) => String(v ?? '').replace(/[0-9]/g, (d) => FA[Number(d)]);
      const esc = (v) => String(v ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
      const STATUS = { active: 'فعال', expired: 'منقضی شده', limited: 'حجم تمام شده', disabled: 'غیرفعال' };

      function bytes(n) {
        const v = Number(n || 0);
        if (!v) return '۰';
        const u = ['بایت', 'کیلوبایت', 'مگابایت', 'گیگابایت', 'ترابایت'];
        let x = v, i = 0;
        while (x >= 1024 && i < u.length - 1) { x /= 1024; i++; }
        return toFa(x.toFixed(i === 0 ? 0 : 1)) + ' ' + u[i];
      }

      const subId = decodeURIComponent(location.pathname.split('/').filter(Boolean).pop() || '');
      const content = document.getElementById('content');

      async function load() {
        try {
          const res = await fetch('/sub/' + encodeURIComponent(subId) + '/info');
          if (!res.ok) throw new Error(res.status === 404 ? 'اشتراک یافت نشد' : 'خطای سرور (' + res.status + ')');
          const info = await res.json();
          paint(info);
        } catch (err) {
          document.getElementById('title').textContent = 'خطا';
          document.getElementById('subtitle').innerHTML = '<span class="err">' + esc(err.message) + '</span>';
          content.innerHTML = '<p class="hint">در صورت ادامهٔ مشکل، با مدیر سرویس خود تماس بگیرید.</p>';
        }
      }

      function paint(info) {
        document.getElementById('title').textContent = 'کانفیگ ' + info.username;
        document.getElementById('subtitle').textContent = 'پروتکل ' + (info.protocol || '').toUpperCase() +
          ' · انتقال ' + (info.network || '').toUpperCase() + ' · امنیت ' + (info.security || '').toUpperCase();
        document.getElementById('statusBox').innerHTML =
          '<span class="status ' + esc(info.status) + '">' + esc(STATUS[info.status] || info.status) + '</span>';

        const used = info.percent_used || 0;
        content.innerHTML =
          '<div class="grid">' +
            '<div class="box"><span>حجم مصرفی</span><strong>' + esc(info.data_used_human) + '</strong>' +
              '<div class="bar ' + (used >= 100 ? 'over' : '') + '"><i style="width:' + Math.min(100, used) + '%"></i></div>' +
              '<p class="hint" style="margin:8px 0 0">سقف: ' + esc(info.data_limit_human) + '</p></div>' +
            '<div class="box"><span>اعتبار</span><strong>' +
              (info.days_left === null || info.days_left === undefined ? 'نامحدود' : toFa(Math.max(0, info.days_left)) + ' روز') +
              '</strong><p class="hint" style="margin:8px 0 0">' +
              (info.expire_date ? 'تا ' + esc(info.expire_date.slice(0, 10).replace(/-/g, '/')) : 'بدون تاریخ انقضا') + '</p></div>' +
          '</div>' +

          '<div style="margin-top:16px" class="qr"><img src="' + esc(info.qrcode) + '" alt="QR code کانفیگ" /></div>' +
          '<p class="hint" style="text-align:center;margin:10px 0 0">اسکن با دوربین گوشی یا افزودن از طریق QR در اپلیکیشن</p>' +

          '<div style="margin-top:16px;display:grid;gap:10px">' +
            info.links.map((l) =>
              '<div><div class="row" style="margin-bottom:6px;align-items:center">' +
                '<strong style="font-size:13px">' + esc(l.server) + '</strong>' +
                '<div style="margin-inline-start:auto" class="row">' +
                  '<button class="btn" data-copy="' + esc(l.link) + '">کپی لینک</button>' +
                '</div></div><div class="link">' + esc(l.link) + '</div></div>').join('') +
          '</div>' +

          '<div class="row" style="margin-top:16px">' +
            '<button class="btn primary" data-copy="' + esc(info.subscription_url) + '">کپی نشانی اشتراک</button>' +
            '<button class="btn" id="reload">↻ به‌روزرسانی</button>' +
          '</div>' +
          '<p class="hint" style="margin-top:10px">نشانی اشتراک را در اپلیکیشن (V2Box / v2rayNG / Streisand) به‌عنوان ' +
            '«Subscription» اضافه کنید تا کانفیگ‌ها خودکار به‌روز بمانند.</p>' +
          '<p class="hint">آخرین اتصال: ' + esc(info.last_connected ? new Date(info.last_connected + 'Z').toLocaleString('fa-IR') : 'ثبت نشده') + '</p>';

        content.querySelectorAll('[data-copy]').forEach((btn) => {
          btn.addEventListener('click', async () => {
            try {
              await navigator.clipboard.writeText(btn.dataset.copy);
              const old = btn.textContent;
              btn.textContent = '✓ کپی شد';
              setTimeout(() => { btn.textContent = old; }, 1600);
            } catch { btn.textContent = 'کپی نشد'; }
          });
        });
        document.getElementById('reload').addEventListener('click', load);
      }

      load();
    </script>
  </body>
</html>
