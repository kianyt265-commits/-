# ==============================================================
#  V2Box Panel — nginx
#   :80    panel UI (frontend/) + reverse proxy to the backend
#   :8080  same panel on an alternative port (handy when 80 is taken
#          by another web server or blocked by the ISP)
# ==============================================================

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# upstream is resolved by docker DNS (service name: backend)
upstream v2box_backend {
    server backend:8000;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 16m;
    charset utf-8;

    # ---------------------------------------------------------- logging --
    access_log /var/log/nginx/v2box.access.log;
    error_log  /var/log/nginx/v2box.error.log warn;

    # ------------------------------------------------------------ gzip ---
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 5;
    gzip_types text/plain text/css text/xml application/json application/javascript
               application/xml+rss image/svg+xml font/woff2;

    # ------------------------------------------------- security headers --
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # ------------------------------------------------------ api proxy ----
    location /api/ {
        proxy_pass http://v2box_backend;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        $connection_upgrade;
        proxy_read_timeout 300s;
        proxy_connect_timeout 15s;
    }

    # ---------------------------------------- public subscription urls ---
    location /sub/ {
        proxy_pass http://v2box_backend;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_buffering off;
        add_header Cache-Control "no-store" always;
    }

    location /share/ {
        proxy_pass http://v2box_backend;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
    }

    # ---------------------------------------------- fastapi api docs -----
    location ~ ^/(docs|redoc|openapi.json)$ {
        proxy_pass http://v2box_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ------------------------------------------------------- frontend ----
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache" always;
    }

    location ~* \.(?:css|js|woff2?|png|jpe?g|svg|ico)$ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
        try_files $uri =404;
    }

    # health check for nginx itself
    location = /nginx-health {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }
}

# ---------------------------------------------------------- alt port ------
server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 16m;
    charset utf-8;

    location /api/ {
        proxy_pass http://v2box_backend;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
    }

    location /sub/ {
        proxy_pass http://v2box_backend;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_buffering off;
    }

    location /share/ {
        proxy_pass http://v2box_backend;
        proxy_set_header Host $host;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
